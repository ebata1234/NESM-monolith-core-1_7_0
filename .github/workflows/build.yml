name: Build mod jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Save the finished jar
        uses: actions/upload-artifact@v4
        with:
          name: nesm-monolith-core-jar
          path: build/libs/*.jar

      - name: Save the build log (also when the build fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
